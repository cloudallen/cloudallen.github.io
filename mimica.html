<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mímica e Desenho</title>
    <meta name="description" content="Sorteie palavras para jogar mímica ou desenho. Draw random words for mime and drawing games.">
    <style>
        :root {
            --felt: #12493a;
            --felt-dark: #0a2a20;
            --ink: #07170f;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text: #eef4ef;
            --muted: #a9c2b6;
            --gold: #f5b942;
            --gold-dark: #d99a1e;
            --red: #e05d5d;
            --teal: #2bb3a3;
            --purple: #8e6cdf;
            --blue: #4f8fe6;
            --orange: #f08a3c;
            --radius: 16px;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background:
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0) 0 0 / 6px 6px,
                radial-gradient(ellipse at top, #18604a 0%, var(--felt) 35%, var(--felt-dark) 75%, #061a13 100%) fixed;
            background-color: var(--felt-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body:has(dialog[open]) { overflow: hidden; }
        a { color: var(--gold); }
        svg.icon { width: 1.2em; height: 1.2em; }

        /* ---------- Top bar ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            background: rgba(6, 26, 19, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--panel-border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: auto;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
        }
        .brand svg { width: 26px; height: 26px; color: var(--gold); }
        .lang-toggle, .seg {
            display: flex;
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .lang-toggle button, .seg button {
            background: transparent;
            color: var(--muted);
            border: 0;
            padding: 6px 12px;
            font: inherit;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
        }
        .lang-toggle button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
        .seg button { padding: 9px 18px; font-size: 0.95em; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 999px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--ink);
            box-shadow: 0 8px 20px rgba(245, 185, 66, 0.3);
        }
        .btn.ghost { background: var(--panel); color: var(--text); border-color: var(--panel-border); }
        .btn.ghost:hover { background: rgba(255,255,255,0.12); }
        .btn.small { padding: 7px 16px; font-size: 0.9em; }

        /* ---------- Controls ---------- */
        main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 40px 24px 56px; }
        .intro { text-align: center; }
        .intro h1 {
            margin: 0;
            font-size: clamp(2.1em, 7vw, 3.2em);
            line-height: 1.15;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, #fff 10%, var(--gold) 55%, var(--orange) 95%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .intro p { margin: 10px 0 0; color: var(--muted); }
        .controls { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 28px; }
        .draw-btn { min-width: 220px; padding: 14px 44px; font-size: 1.25em; }
        .status { margin: 0; color: var(--muted); font-size: 0.92em; text-align: center; }
        .status.warn { color: var(--gold); }

        /* ---------- Timer ---------- */
        .timer {
            position: sticky;
            top: 68px;
            z-index: 40;
            max-width: 420px;
            margin: 24px auto 0;
            padding: 12px 20px 16px;
            background: #0f2c22;
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            box-shadow: 0 12px 28px rgba(0,0,0,0.35);
        }
        .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
        .timer-time { font-size: 2.6em; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .timer-bar { height: 8px; margin-top: 8px; overflow: hidden; border-radius: 4px; background: rgba(255,255,255,0.12); }
        .timer-bar i { display: block; height: 100%; border-radius: 4px; background: var(--gold); transition: width 0.1s linear; }
        .timer.warn { border-color: var(--red); }
        .timer.warn .timer-time { color: var(--red); animation: pulse 1s ease-in-out infinite; }
        .timer.warn .timer-bar i { background: var(--red); }
        .timer.done { border-color: var(--red); background: #4a1c1c; }
        .timer.done .timer-time { font-size: 1.8em; }
        @keyframes pulse {
            50% { opacity: 0.55; }
        }

        /* ---------- Word cards ---------- */
        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
        }
        .results { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 32px; }
        .hint { margin: 0; padding: 28px 12px; color: var(--muted); font-style: italic; text-align: center; }
        .word-card {
            flex: 1 1 260px;
            max-width: 340px;
            min-width: 0;
            padding: 18px 20px 22px;
            border-top: 4px solid var(--c);
        }
        .word-card.deal { animation: deal 0.32s ease-out backwards; animation-delay: calc(var(--i) * 60ms); }
        @keyframes deal {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
        }
        .word-cat { display: flex; align-items: center; gap: 10px; }
        .word-icon {
            flex-shrink: 0;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--ink);
            border: 2px solid var(--c);
            font-size: 1.3em;
            line-height: 1;
        }
        .word-cat-name {
            min-width: 0;
            font-size: 0.75em;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: 0.06em;
            color: var(--muted);
        }
        .word-main { margin-top: 14px; font-size: 1.65em; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
        .word-alt { margin-top: 4px; font-size: 1.15em; line-height: 1.25; color: var(--gold); overflow-wrap: anywhere; }

        /* ---------- Settings ---------- */
        dialog {
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--text);
            max-width: min(720px, calc(100vw - 24px));
            width: 100%;
        }
        dialog::backdrop { background: rgba(3, 12, 8, 0.78); backdrop-filter: blur(4px); }
        .modal-inner {
            position: relative;
            max-height: calc(100vh - 48px);
            max-height: calc(100dvh - 48px);
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 26px 28px 28px;
            background: #0f2c22;
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .modal-inner:focus { outline: none; }
        .modal-inner h2 { margin: 0; padding-right: 44px; font-size: 1.6em; line-height: 1.25; }
        .close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 2;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 0;
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }
        .close-btn:hover { background: rgba(0,0,0,0.6); }
        .setting { margin-top: 22px; }
        .setting h3 {
            margin: 0 0 10px;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--gold);
        }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            padding: 8px 15px;
            border-radius: 999px;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            color: var(--text);
            font: inherit;
            font-weight: 600;
            font-size: 0.92em;
            cursor: pointer;
        }
        .chip:hover { background: rgba(255,255,255,0.12); }
        .chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--ink); }
        .summary { margin: 12px 0 0; color: var(--muted); font-size: 0.9em; }
        .preset-cats { margin: 6px 0 0; color: var(--muted); font-size: 0.82em; }
        .custom-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .cat-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px; margin-top: 12px; }
        .cat-check {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 44px;
            padding: 6px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            background: var(--panel);
            font-size: 0.82em;
            font-weight: 600;
            line-height: 1.25;
            cursor: pointer;
        }
        .cat-check:has(input:checked) { border-color: var(--gold); }
        .cat-check input { flex-shrink: 0; width: 18px; height: 18px; margin: 0; accent-color: var(--gold); }
        .cat-check .emoji { font-size: 1.3em; line-height: 1; }
        .cat-check .count { margin-left: auto; color: var(--muted); font-weight: 400; }
        .stepper { display: inline-flex; align-items: center; gap: 8px; }
        .stepper button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            color: var(--text);
            font: inherit;
            font-size: 1.3em;
            line-height: 1;
            cursor: pointer;
        }
        .stepper button:hover:not(:disabled) { background: rgba(255,255,255,0.12); }
        .stepper button:disabled { opacity: 0.4; cursor: not-allowed; }
        .stepper input {
            width: 72px;
            height: 44px;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            background: var(--ink);
            color: var(--text);
            font: inherit;
            font-size: 1.15em;
            font-weight: 700;
            text-align: center;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .timer-toggle { display: inline-flex; font-size: 0.92em; }
        #timer-box .summary { margin: 12px 0 8px; }
        .modal-actions { display: flex; justify-content: flex-end; margin-top: 26px; }

        /* ---------- Footer ---------- */
        footer {
            text-align: center;
            padding: 24px 24px 32px;
            color: var(--muted);
            border-top: 1px solid var(--panel-border);
            font-size: 0.92em;
        }
        footer a { margin: 0 8px; }

        @media (max-width: 640px) {
            .topbar { padding: 8px 12px; gap: 8px; }
            .settings-label { display: none; }
            #settings-btn { padding: 7px 10px; }
            main { padding: 28px 16px 44px; }
            .word-card { flex-basis: 100%; max-width: none; }
            .word-main { font-size: 1.5em; }
            .modal-inner { padding: 22px 18px 22px; }
            .cat-list { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<nav class="topbar">
    <div class="brand">

            <g fill="#07170f"><circle cx="20" cy="20" r="5"/><circle cx="44" cy="20" r="5"/><circle cx="32" cy="32" r="5"/><circle cx="20" cy="44" r="5"/><circle cx="44" cy="44" r="5"/></g>

        <span data-i18n="brand"></span>

    <button class="btn ghost small" type="button" id="settings-btn">

            <circle cx="12" cy="12" r="3"/>

        </svg>
        <span class="settings-label" data-i18n="settings"></span>
    </button>
    <div class="lang-toggle" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="pt" aria-pressed="true">PT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
</nav>

<main>
    <div class="intro">
        <h1 data-i18n="title"></h1>
        <p data-i18n="lead"></p>
    </div>

    <div class="controls">
        <div class="seg" role="group" id="word-lang">
            <button type="button" data-word-lang="en">English</button>
            <button type="button" data-word-lang="pt">Português</button>
            <button type="button" data-word-lang="both" data-i18n="both"></button>
        </div>
        <button class="btn primary draw-btn" type="button" id="draw-btn" data-i18n="draw"></button>
        <p class="status" id="status"></p>
    </div>

    <div class="timer" id="timer" hidden>
        <div class="timer-row">
            <div class="timer-time" id="timer-time" role="timer"></div>
            <button class="btn ghost small" type="button" id="timer-stop" data-i18n="timer_stop"></button>
        </div>
        <div class="timer-bar"><i id="timer-fill"></i></div>
    </div>

    <div class="results" id="results" aria-live="polite"></div>
</main>

<footer>
    <a href="gamenight.html" data-i18n="footer_gamenight"></a>
    <a href="index.html" data-i18n="footer_home"></a>
</footer>

<dialog id="settings" aria-labelledby="settings-title">
    <div class="modal-inner">
        <button class="close-btn" type="button" data-close>&times;</button>
        <h2 id="settings-title" data-i18n="settings"></h2>

        <div class="setting">
            <h3 data-i18n="categories"></h3>
            <div class="chips" id="preset-chips"></div>
            <p class="summary" id="summary"></p>
            <p class="preset-cats" id="preset-cats"></p>
            <div id="custom-box">
                <div class="custom-actions">
                    <button class="btn ghost small" type="button" id="select-all" data-i18n="select_all"></button>
                    <button class="btn ghost small" type="button" id="select-none" data-i18n="select_none"></button>
                </div>
                <div class="cat-list" id="cat-list"></div>
            </div>
        </div>

        <div class="setting">
            <h3 id="count-label" data-i18n="per_draw"></h3>
            <div class="stepper">
                <button type="button" id="count-down">&minus;</button>
                <input type="number" id="count" inputmode="numeric" aria-labelledby="count-label">
                <button type="button" id="count-up">+</button>
            </div>
        </div>

        <div class="setting">
            <h3 data-i18n="timer"></h3>
            <label class="cat-check timer-toggle"><input type="checkbox" id="timer-on"><span data-i18n="timer_use"></span></label>
            <div id="timer-box">
                <p class="summary" id="timer-label" data-i18n="timer_seconds"></p>
                <div class="stepper">
                    <button type="button" id="timer-down">&minus;</button>
                    <input type="number" id="timer-seconds" inputmode="numeric" aria-labelledby="timer-label">
                    <button type="button" id="timer-up">+</button>
                </div>
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn primary" type="button" data-close data-i18n="done"></button>
        </div>
    </div>
</dialog>

            no_cats: 'Nenhuma categoria selecionada. Escolha pelo menos uma nas configurações.',
            categories: 'Categorias',
            custom: 'Personalizado',
            select_all: 'Marcar todas',
            select_none: 'Limpar',
            per_draw: 'Palavras por sorteio',
            less: 'Menos', more: 'Mais',
            timer: 'Temporizador',
            timer_use: 'Usar temporizador',
            timer_seconds: 'Segundos',
            timer_fmt: '{n} s',
            timer_stop: 'Parar',
            time_up: 'Tempo esgotado!',
            done: 'Pronto',
            close: 'Fechar',
            word_one: 'palavra', word_many: 'palavras',
            cat_one: 'categoria', cat_many: 'categorias',
            footer_gamenight: 'Noite de Jogos',
            footer_home: 'Página inicial'
        },
        en: {
            doc_title: 'Mime & Draw',
            brand: 'Mime & Draw',
            title: 'Mime & Draw',
            lead: 'Draw random words for mime and drawing games.',
            settings: 'Settings',
            word_lang: 'Word language',
            both: 'Both',
            draw: 'Draw',
            per_draw_fmt: '{n} per draw',
            hint: 'Press "Draw" to get your words.',
            no_cats: 'No categories selected. Pick at least one in the settings.',
            categories: 'Categories',
            custom: 'Custom',
            select_all: 'Select all',
            select_none: 'Clear',
            per_draw: 'Words per draw',
            less: 'Fewer', more: 'More',
            timer: 'Timer',
            timer_use: 'Use a timer',
            timer_seconds: 'Seconds',
            timer_fmt: '{n} s',
            timer_stop: 'Stop',
            time_up: 'Time\'s up!',
            done: 'Done',
            close: 'Close',
            word_one: 'word', word_many: 'words',
            cat_one: 'category', cat_many: 'categories',
            footer_gamenight: 'Game Night',
            footer_home: 'Home page'
        }
    };

    // =====================================================================
    //  Word list
    // =====================================================================

    // A line between two ==== lines is a category header, "EN | PT  (count)".
    // Any other line with a | below a header is a word.
    function parseWords(text) {
        const lines = text.split(/\r?\n/).map(l => l.trim());
        const cats = [];
        lines.forEach((line, i) => {
            if (!line.includes('|')) return;
            const [en, pt] = line.split('|').map(s => s.trim());
            const isHeader = i > 0 && lines[i - 1].startsWith('====') && (lines[i + 1] || '').startsWith('====');
            if (isHeader) cats.push({ en, pt: pt.replace(/\s*\(\d+\)$/, ''), words: [] });
            else if (cats.length) cats[cats.length - 1].words.push({ en, pt });
        });
        return cats;
    }

    const CATS = parseWords(document.getElementById('words').textContent);
    const CARD_COLORS = ['var(--gold)', 'var(--red)', 'var(--teal)', 'var(--purple)', 'var(--blue)', 'var(--orange)'];
    const catIcon = c => CATEGORY_ICONS[c.en] || DEFAULT_ICON;
    const catColor = c => CARD_COLORS[CATS.indexOf(c) % CARD_COLORS.length];

    // =====================================================================
    //  Settings
    // =====================================================================

    function clampInt(value, min, max, fallback) {
        const n = Math.round(Number(value));
        return Number.isFinite(n) && value !== '' && value !== null ? Math.min(max, Math.max(min, n)) : fallback;
    }
    const clampCount = value => clampInt(value, COUNT_MIN, COUNT_MAX, COUNT_DEFAULT);
    const clampTimer = value => clampInt(value, TIMER_MIN, TIMER_MAX, TIMER_DEFAULT);

    function loadSettings() {
        let s = null;
        try { s = JSON.parse(localStorage.getItem('mimica-settings')); } catch (e) {}
        s = s || {};
        return {
            preset: s.preset === 'custom' || Object.keys(PRESETS).includes(s.preset) ? s.preset : 'all',
            cats: (Array.isArray(s.cats) ? s.cats : []).filter(name => CATS.some(c => c.en === name)),
            count: clampCount(s.count === undefined ? null : s.count),
            wordLang: ['en', 'pt', 'both'].includes(s.wordLang) ? s.wordLang : 'both',
            timerOn: s.timerOn === true,
            timerSeconds: clampTimer(s.timerSeconds === undefined ? null : s.timerSeconds)
        };
    }

    const settings = loadSettings();

    function saveSettings() {
        try { localStorage.setItem('mimica-settings', JSON.stringify(settings)); } catch (e) {}
    }

    function activeCats() {
        if (settings.preset === 'custom') return CATS.filter(c => settings.cats.includes(c.en));
        const names = PRESETS[settings.preset].cats;
        return names ? CATS.filter(c => names.includes(c.en)) : CATS;
    }

    // Some words are in more than one category, so the pool keeps one copy of each
    function buildPool() {
        const seen = new Set();
        const pool = [];
        activeCats().forEach(cat => cat.words.forEach(w => {
            const key = w.en + '|' + w.pt;
            if (seen.has(key)) return;
            seen.add(key);
            pool.push({ en: w.en, pt: w.pt, cat });
        }));
        return pool;
    }

    const presetName = () => settings.preset === 'custom' ? t('custom') : PRESETS[settings.preset].name[lang];
    const plural = (n, one, many) => n.toLocaleString(lang === 'pt' ? 'pt-BR' : 'en-US') + ' ' + t(n === 1 ? one : many);

    // =====================================================================
    //  Rendering
    // =====================================================================

    let lang = 'pt';
    let lastDraw = [];
    const t = key => STRINGS[lang][key];
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const settingsDialog = document.getElementById('settings');
    const countInput = document.getElementById('count');
    const timerInput = document.getElementById('timer-seconds');
    const results = document.getElementById('results');

    function cardHtml(w, i, deal) {
        const both = settings.wordLang === 'both';
        const catName = both ? [...new Set([w.cat.en, w.cat.pt])].join(' · ') : w.cat[settings.wordLang];
        return '<div class="word-card panel' + (deal ? ' deal' : '') + '" style="--c: ' + catColor(w.cat) + '; --i: ' + i + '">' +
            '<div class="word-cat"><span class="word-icon" aria-hidden="true">' + catIcon(w.cat) + '</span>' +
                '<span class="word-cat-name">' + esc(catName) + '</span></div>' +
            '<div class="word-main">' + esc(both ? w.en : w[settings.wordLang]) + '</div>' +
            (both && w.pt !== w.en ? '<div class="word-alt">' + esc(w.pt) + '</div>' : '') +
        '</div>';
    }

    function renderResults(deal) {
        results.innerHTML = lastDraw.length
            ? lastDraw.map((w, i) => cardHtml(w, i, deal)).join('')
            : '<p class="hint">' + esc(t('hint')) + '</p>';
    }

    // Everything that depends on the current settings, without rebuilding the controls
    function syncSettings() {
        const pool = buildPool();
        const cats = activeCats();
        const custom = settings.preset === 'custom';

        const status = document.getElementById('status');
        status.classList.toggle('warn', !pool.length);
        status.textContent = pool.length
            ? presetName() + ' · ' + plural(pool.length, 'word_one', 'word_many') + ' · ' + t('per_draw_fmt').replace('{n}', settings.count) +
                (settings.timerOn ? ' · ' + t('timer_fmt').replace('{n}', settings.timerSeconds) : '')
            : t('no_cats');
        document.getElementById('draw-btn').disabled = !pool.length;

        document.querySelectorAll('#word-lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.wordLang === settings.wordLang));
        document.querySelectorAll('#preset-chips .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.preset === settings.preset));
        document.querySelectorAll('#cat-list input').forEach(box => { box.checked = settings.cats.includes(box.value); });

        document.getElementById('summary').textContent = plural(cats.length, 'cat_one', 'cat_many') + ' · ' + plural(pool.length, 'word_one', 'word_many');
        const presetCats = document.getElementById('preset-cats');
        presetCats.hidden = custom;
        presetCats.textContent = cats.map(c => catIcon(c) + ' ' + c[lang]).join('  ·  ');
        document.getElementById('custom-box').hidden = !custom;

        countInput.value = settings.count;
        document.getElementById('count-down').disabled = settings.count <= COUNT_MIN;
        document.getElementById('count-up').disabled = settings.count >= COUNT_MAX;

        document.getElementById('timer-on').checked = settings.timerOn;
        document.getElementById('timer-box').hidden = !settings.timerOn;
        timerInput.value = settings.timerSeconds;
        document.getElementById('timer-down').disabled = settings.timerSeconds <= TIMER_MIN;
        document.getElementById('timer-up').disabled = settings.timerSeconds >= TIMER_MAX;
    }

    function changed() {
        saveSettings();
        syncSettings();
    }

    function renderSettings() {
        document.getElementById('preset-chips').innerHTML =
            Object.keys(PRESETS).map(id => '<button class="chip" type="button" data-preset="' + id + '">' + esc(PRESETS[id].name[lang]) + '</button>').join('') +
            '<button class="chip" type="button" data-preset="custom">' + esc(t('custom')) + '</button>';
        document.getElementById('cat-list').innerHTML = CATS.map(c =>
            '<label class="cat-check"><input type="checkbox" value="' + esc(c.en) + '">' +
                '<span class="emoji" aria-hidden="true">' + catIcon(c) + '</span>' +
                '<span>' + esc(c[lang]) + '</span><span class="count">' + c.words.length + '</span></label>'
        ).join('');
    }

    function setLang(next) {
        lang = next;
        try { localStorage.setItem('gamenight-lang', lang); } catch (e) {}
        document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
        document.title = t('doc_title');
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('.lang-toggle button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
        document.querySelectorAll('.close-btn').forEach(b => b.setAttribute('aria-label', t('close')));
        document.getElementById('settings-btn').setAttribute('aria-label', t('settings'));
        document.getElementById('word-lang').setAttribute('aria-label', t('word_lang'));
        document.getElementById('count-down').setAttribute('aria-label', t('less'));
        document.getElementById('count-up').setAttribute('aria-label', t('more'));
        document.getElementById('timer-down').setAttribute('aria-label', t('less'));
        document.getElementById('timer-up').setAttribute('aria-label', t('more'));
        renderSettings();
        syncSettings();
        renderResults(false);
        renderTimer();
    }

    // =====================================================================
    //  Sound effects (synthesized, so the page needs no audio files)
    // =====================================================================

    let audio = null;
    let audioOut = null;

    // Browsers only allow sound after a user action, so this runs on the Draw click
    function readyAudio() {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return false;
        if (!audio) {
            audio = new Context();
            audioOut = audio.createDynamicsCompressor();
            audioOut.connect(audio.destination);
        }
        if (audio.state === 'suspended') audio.resume();
        return true;
    }

    function tone(delay, duration, freq, type) {
        const start = audio.currentTime + delay;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(1, start);
        gain.gain.setValueAtTime(1, start + duration - 0.03);
        gain.gain.linearRampToValueAtTime(0, start + duration);
        osc.connect(gain);
        gain.connect(audioOut);
        osc.start(start);
        osc.stop(start + duration);
    }

    // A rising fanfare
    function playDrawSound() {
        if (!readyAudio()) return;
        [523, 659, 784].forEach((freq, i) => tone(i * 0.11, 0.1, freq, 'square'));
        tone(0.33, 0.4, 1047, 'square');
        tone(0.33, 0.4, 784, 'sawtooth');
    }

    // Four harsh buzzer blasts
    function playTimeUpSound() {
        if (!readyAudio()) return;
        for (let i = 0; i < 4; i++) {
            tone(i * 0.48, 0.36, 180, 'sawtooth');
            tone(i * 0.48, 0.36, 191, 'sawtooth');
            tone(i * 0.48, 0.36, 382, 'square');
        }
    }

    // =====================================================================
    //  Timer
    // =====================================================================

    let timerTotal = 0; // ms; 0 means no timer on screen
    let timerEnd = 0;
    let timerId = null;
    let timerDone = false;
    let wakeLock = null;

    // Keep the phone screen on, or it can sleep before the time is up
    function keepScreenOn() {
        if (wakeLock || !navigator.wakeLock) return;
        navigator.wakeLock.request('screen').then(lock => {
            wakeLock = lock;
            if (timerId === null) releaseScreen();
        }).catch(() => {});
    }

    function releaseScreen() {
        if (wakeLock) wakeLock.release().catch(() => {});
        wakeLock = null;
    }

    function renderTimer() {
        const box = document.getElementById('timer');
        box.hidden = !timerTotal;
        if (!timerTotal) return;
        const left = timerDone ? 0 : Math.max(0, timerEnd - Date.now());
        const secs = Math.ceil(left / 1000);
        box.classList.toggle('done', timerDone);
        box.classList.toggle('warn', !timerDone && secs <= TIMER_WARNING);
        document.getElementById('timer-time').textContent = timerDone ? t('time_up') : Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
        document.getElementById('timer-fill').style.width = (left / timerTotal * 100) + '%';
        document.getElementById('timer-stop').hidden = timerDone;
    }

    function tick() {
        if (Date.now() >= timerEnd) {
            clearInterval(timerId);
            timerId = null;
            timerDone = true;
            releaseScreen();
            playTimeUpSound();
        }
        renderTimer();
    }

    function startTimer() {
        clearInterval(timerId);
        timerDone = false;
        timerTotal = settings.timerSeconds * 1000;
        timerEnd = Date.now() + timerTotal;
        timerId = setInterval(tick, 100);
        keepScreenOn();
        renderTimer();
    }

    function stopTimer() {
        clearInterval(timerId);
        timerId = null;
        timerTotal = 0;
        timerDone = false;
        releaseScreen();
        renderTimer();
    }

    // =====================================================================
    //  Draw
    // =====================================================================

    function draw() {
        const pool = buildPool();
        const n = Math.min(settings.count, pool.length);
        // Partial Fisher-Yates: only the first n positions need shuffling
        for (let i = 0; i < n; i++) {
            const j = i + Math.floor(Math.random() * (pool.length - i));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        lastDraw = pool.slice(0, n);
        renderResults(true);
        if (settings.timerOn) {
            playDrawSound();
            startTimer();
        }
    }

    // =====================================================================
    //  Events
    // =====================================================================

    document.querySelectorAll('.lang-toggle button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    document.getElementById('draw-btn').addEventListener('click', draw);

    document.getElementById('word-lang').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b) return;
        settings.wordLang = b.dataset.wordLang;
        changed();
        renderResults(false);
    });

    document.getElementById('settings-btn').addEventListener('click', () => {
        settingsDialog.showModal();
        settingsDialog.querySelector('.modal-inner').scrollTop = 0;
    });
    settingsDialog.addEventListener('click', e => {
        if (e.target === settingsDialog || e.target.closest('[data-close]')) settingsDialog.close();
    });

    document.getElementById('preset-chips').addEventListener('click', e => {
        const b = e.target.closest('.chip');
        if (!b) return;
        // Custom starts from whatever was selected before
        if (b.dataset.preset === 'custom' && settings.preset !== 'custom') settings.cats = activeCats().map(c => c.en);
        settings.preset = b.dataset.preset;
        changed();
    });

    document.getElementById('cat-list').addEventListener('change', e => {
        settings.cats = [...document.querySelectorAll('#cat-list input:checked')].map(box => box.value);
        changed();
    });
    document.getElementById('select-all').addEventListener('click', () => {
        settings.cats = CATS.map(c => c.en);
        changed();
    });
    document.getElementById('select-none').addEventListener('click', () => {
        settings.cats = [];
        changed();
    });

    function setCount(value) {
        settings.count = clampCount(value);
        changed();
    }
    countInput.min = COUNT_MIN;
    countInput.max = COUNT_MAX;
    countInput.addEventListener('change', () => setCount(countInput.value));
    document.getElementById('count-down').addEventListener('click', () => setCount(settings.count - 1));
    document.getElementById('count-up').addEventListener('click', () => setCount(settings.count + 1));

    function setTimerSeconds(value) {
        settings.timerSeconds = clampTimer(value);
        changed();
    }
    timerInput.min = TIMER_MIN;
    timerInput.max = TIMER_MAX;
    timerInput.addEventListener('change', () => setTimerSeconds(timerInput.value));
    document.getElementById('timer-down').addEventListener('click', () => setTimerSeconds(settings.timerSeconds - TIMER_STEP));
    document.getElementById('timer-up').addEventListener('click', () => setTimerSeconds(settings.timerSeconds + TIMER_STEP));
    document.getElementById('timer-on').addEventListener('change', e => {
        settings.timerOn = e.target.checked;
        if (!settings.timerOn) stopTimer();
        changed();
    });
    document.getElementById('timer-stop').addEventListener('click', stopTimer);

    // =====================================================================
    //  Start
    // =====================================================================

    let saved = null;
    try { saved = localStorage.getItem('gamenight-lang'); } catch (e) {}
    setLang(saved === 'pt' || saved === 'en' ? saved : ((navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en'));
</script>
