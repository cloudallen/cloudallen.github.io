<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noite de Jogos · IMPA</title>
    <meta name="description" content="Noite de Jogos no IMPA, toda quinta-feira das 18:30 às 21:00. Game Night at IMPA, every Thursday from 6:30 to 9 PM.">
    <style>
        :root {
            --felt: #12493a;
            --felt-dark: #0a2a20;
            --ink: #07170f;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text: #eef4ef;
            --muted: #a9c2b6;
            --gold: #f5b942;
            --gold-dark: #d99a1e;
            --red: #e05d5d;
            --teal: #2bb3a3;
            --purple: #8e6cdf;
            --blue: #4f8fe6;
            --orange: #f08a3c;
            --radius: 16px;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 72px; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background:
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0) 0 0 / 6px 6px,
                radial-gradient(ellipse at top, #18604a 0%, var(--felt) 35%, var(--felt-dark) 75%, #061a13 100%) fixed;
            background-color: var(--felt-dark);
            min-height: 100vh;
        }
        body:has(dialog[open]) { overflow: hidden; }
        a { color: var(--gold); }
        svg.icon { width: 1em; height: 1em; vertical-align: -0.15em; }

        /* ---------- Top bar ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            background: rgba(6, 26, 19, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--panel-border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            white-space: nowrap;
        }
        .brand svg { width: 26px; height: 26px; color: var(--gold); }
        .nav-links {
            display: flex;
            gap: 4px;
            margin-left: auto;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 999px;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }
        .nav-links a:hover { color: var(--text); background: var(--panel); }
        .lang-toggle {
            display: flex;
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .lang-toggle button {
            background: transparent;
            color: var(--muted);
            border: 0;
            padding: 6px 12px;
            font: inherit;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
        }
        .lang-toggle button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }

        /* ---------- Hero ---------- */
        .hero {
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 80px 24px 72px;
        }
        .hero-inner { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }
        .eyebrow {
            display: inline-block;
            margin: 0 0 12px;
            padding: 4px 14px;
            border-radius: 999px;
            background: rgba(245, 185, 66, 0.14);
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.8em;
        }
        .hero h1 {
            margin: 0;
            font-size: clamp(2.6em, 9vw, 4.6em);
            line-height: 1.05;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, #fff 10%, var(--gold) 55%, var(--orange) 95%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero-sub { font-size: clamp(1.15em, 3.6vw, 1.5em); font-weight: 600; margin: 14px 0 6px; }
        .hero-tag { color: var(--muted); margin: 0 auto; max-width: 520px; }

        .floaty {
            position: absolute;
            opacity: 0.22;
            animation: float 9s ease-in-out infinite;
        }
        .floaty.f1 { width: 90px; top: 12%; left: 7%; color: var(--gold); --rot: -14deg; }
        .floaty.f2 { width: 64px; top: 62%; left: 13%; color: var(--red); --rot: 18deg; animation-delay: -3s; }
        .floaty.f3 { width: 80px; top: 16%; right: 9%; color: var(--teal); --rot: 10deg; animation-delay: -5s; }
        .floaty.f4 { width: 58px; top: 66%; right: 14%; color: var(--purple); --rot: -20deg; animation-delay: -1.5s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(var(--rot)); }
            50% { transform: translateY(-18px) rotate(calc(var(--rot) + 8deg)); }
        }

        .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 999px;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--ink);
            box-shadow: 0 8px 20px rgba(245, 185, 66, 0.3);
        }
        .btn.ghost { background: var(--panel); color: var(--text); border-color: var(--panel-border); }
        .btn.ghost:hover { background: rgba(255,255,255,0.12); }
        .btn[aria-disabled="true"] { opacity: 0.55; pointer-events: none; }

        /* ---------- Sections ---------- */
        main section { max-width: 1100px; margin: 0 auto; padding: 56px 24px; }
        .section-head { text-align: center; margin-bottom: 32px; }
        .section-head h2 { margin: 0; font-size: clamp(1.7em, 5vw, 2.3em); }
        .section-head h2::after {
            content: '';
            display: block;
            width: 64px;
            height: 4px;
            margin: 10px auto 0;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--gold), var(--orange));
        }
        .section-head p { color: var(--muted); margin: 12px 0 0; }

        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
        }

        /* Info cards */
        .info-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
        .info-card { padding: 24px; }
        .info-card .ic {
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-size: 24px;
            color: var(--ink);
        }
        .info-card h3 { margin: 0; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
        .info-card .main { font-size: 1.3em; font-weight: 700; margin: 2px 0 8px; }
        .info-card p { margin: 0 0 6px; color: var(--muted); }

        /* Games */
        .games-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        .game-card {
            display: flex;
            flex-direction: column;
            text-align: left;
            padding: 0;
            overflow: hidden;
            color: var(--text);
            font: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .game-card:hover, .game-card:focus-visible {
            transform: translateY(-5px) rotate(-0.4deg);
            box-shadow: 0 18px 36px rgba(0,0,0,0.35);
            border-color: var(--c);
            outline: none;
        }
        .gc-top {
            position: relative;
            height: 110px;
            background: var(--c);
            background:
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.35), transparent 45%),
                linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 45%, #000));
        }
        .gc-mono {
            position: absolute;
            left: 18px;
            bottom: -32px;
            display: grid;
            place-items: center;
            width: 68px;
            height: 68px;
            overflow: hidden;
            border-radius: 16px;
            background: var(--ink);
            border: 3px solid var(--c);
            font-size: 1.8em;
            font-weight: 800;
            color: var(--c);
        }
        .gc-mono svg { width: 44px; height: 44px; }
        .gc-mono img { width: 100%; height: 100%; object-fit: cover; }
        .gc-cat {
            position: absolute;
            right: 12px;
            top: 12px;
            padding: 2px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,0.35);
            font-size: 0.75em;
            font-weight: 600;
        }
        .gc-body { padding: 42px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .gc-body h3 { margin: 0; font-size: 1.2em; }
        .gc-body p { margin: 0; color: var(--muted); font-size: 0.92em; flex: 1; }
        .soon { font-style: italic; opacity: 0.8; }
        .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85em; color: var(--text); }
        .meta span { display: inline-flex; align-items: center; gap: 5px; }
        .pips { display: inline-flex; gap: 3px; }
        .pips i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.18); }
        .pips i.on { background: var(--gold); }

        /* ---------- Dialogs ---------- */
        dialog {
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--text);
            max-width: min(720px, calc(100vw - 24px));
            width: 100%;
        }
        dialog::backdrop { background: rgba(3, 12, 8, 0.78); backdrop-filter: blur(4px); }
        .modal-inner {
            position: relative;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            background: #0f2c22;
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .modal-head {
            padding: 28px 28px 22px;
            background: var(--c);
            background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 40%, #000));
        }
        .modal-head h2 { margin: 0 0 8px; font-size: 1.8em; }
        .modal-head p { margin: 10px 0 0; opacity: 0.9; }
        .modal-body { padding: 8px 28px 28px; }
        .rule { margin-top: 20px; }
        .rule h3 {
            margin: 0 0 6px;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--gold);
        }
        .rule p { margin: 0; }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 2;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 0;
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }
        .close-btn:hover { background: rgba(0,0,0,0.6); }

        /* ---------- Footer ---------- */
        footer {
            text-align: center;
            padding: 36px 24px 48px;
            color: var(--muted);
            border-top: 1px solid var(--panel-border);
            font-size: 0.92em;
        }
        footer p { margin: 6px 0; }

        @media (max-width: 640px) {
            .topbar { padding: 8px 12px; gap: 8px; }
            .brand span { display: none; }
            .nav-links { margin-left: 0; flex: 1; }
            .nav-links a { padding: 6px 8px; font-size: 0.92em; }
            .hero { padding: 56px 16px 52px; }
            .floaty.f1, .floaty.f3 { width: 44px; top: 14px; }
            .floaty.f2, .floaty.f4 { display: none; }
            main section { padding: 44px 16px; }
            .modal-head, .modal-body { padding-left: 20px; padding-right: 20px; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<nav class="topbar">
    <a class="brand" href="#top"><svg><use href="#i-die"/></svg><span data-i18n="brand">Noite de Jogos</span></a>
    <div class="nav-links">
        <a href="#info" data-i18n="nav_info">Informações</a>
        <a href="#games" data-i18n="nav_games">Jogos</a>
    </div>
    <div class="lang-toggle" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="pt" aria-pressed="true">PT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
</nav>

<header class="hero" id="top">
    <svg class="floaty f1" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-die"/></svg>
    <svg class="floaty f2" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-pawn"/></svg>
    <svg class="floaty f3" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-card"/></svg>
    <svg class="floaty f4" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-die"/></svg>
    <div class="hero-inner">
        <p class="eyebrow">IMPA · Rio de Janeiro</p>
        <h1 data-i18n="hero_title">Noite de Jogos</h1>
        <p class="hero-sub" data-i18n="hero_sub">Toda quinta-feira, das 18:30 às 21:00</p>
        <p class="hero-tag" data-i18n="hero_tag"></p>

        <div class="cta">
            <a class="btn primary" href="#games"><svg class="icon"><use href="#i-die"/></svg><span data-i18n="cta_games"></span></a>
        </div>
    </div>
</header>

<main>
    <section id="info">
        <div class="section-head">
            <h2 data-i18n="info_title"></h2>
        </div>
        <div class="info-grid">
            <div class="info-card panel">
                <div class="ic" style="background: var(--gold)"><svg class="icon"><use href="#i-clock"/></svg></div>
                <h3 data-i18n="when_title"></h3>
                <div class="main" data-i18n="when_main"></div>
                <p data-i18n="when_text"></p>
            </div>
            <div class="info-card panel">
                <div class="ic" style="background: var(--red)"><svg class="icon"><use href="#i-pin"/></svg></div>
                <h3 data-i18n="where_title"></h3>
                <div class="main">IMPA</div>
                <p id="room"></p>
            </div>
            <div class="info-card panel">
                <div class="ic" style="background: var(--teal)"><svg class="icon"><use href="#i-people"/></svg></div>
                <h3 data-i18n="who_title"></h3>
                <div class="main" data-i18n="who_main"></div>
                <p data-i18n="who_text"></p>
            </div>
            <div class="info-card panel">
                <div class="ic" style="background: var(--purple)"><svg class="icon"><use href="#i-chat"/></svg></div>
                <h3 data-i18n="chat_title"></h3>
                <div class="main" data-i18n="chat_main"></div>
                <p data-i18n="chat_text"></p>
            </div>
        </div>
    </section>

    <section id="games">
        <div class="section-head">
            <h2 data-i18n="games_title"></h2>
            <p data-i18n="games_lead"></p>
        </div>
        <div class="games-grid" id="games-grid"></div>
    </section>
</main>

<footer>

    function setLang(next) {
        lang = next;
        try { localStorage.setItem('gamenight-lang', lang); } catch (e) {}
        document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
        document.title = t('doc_title');
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('.lang-toggle button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
        document.querySelectorAll('[data-close]').forEach(b => b.setAttribute('aria-label', t('close')));

        document.getElementById('room').textContent = CONFIG.room[lang];

        renderGames();
        if (gameModal.open && openGameId) renderModal(openGameId);
    }

    document.querySelectorAll('.lang-toggle button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

    function metaHtml(g) {
        const parts = [];

        if (g.complexity) parts.push(pips(g.complexity));
        return parts.length ? '<div class="meta"><span>' + parts.join('</span><span>') + '</span></div>' : '';
    }

    const gameColor = g => CAT_COLORS[g.category] || 'var(--teal)';

    function gamePicture(g) {
        if (g.image) return '<img src="' + esc(g.image) + '" alt="">';

        return esc(g.name.replace(/^The\s+/i, '')[0]);
    }

            '</button>'
        ).join('');

            .map(([k, text]) => '<div class="rule"><h3>' + esc(t(k)) + '</h3><p>' + esc(text) + '</p></div>').join('');

    let saved = null;
    try { saved = localStorage.getItem('gamenight-lang'); } catch (e) {}
    setLang(saved === 'pt' || saved === 'en' ? saved : ((navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en'));
</script>
